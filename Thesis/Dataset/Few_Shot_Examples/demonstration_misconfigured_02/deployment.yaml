apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-dashboard
  namespace: observability
  annotations:
    description: "Static metrics dashboard serving pre-built HTML charts, no backend API calls or credential access required"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-dashboard
  template:
    metadata:
      labels:
        app: metrics-dashboard
    spec:
      serviceAccountName: metrics-dashboard-sa
      containers:
      - name: dashboard
        image: nginx:1.25.3
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
