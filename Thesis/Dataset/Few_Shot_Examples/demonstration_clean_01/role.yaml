apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployment-reader
  namespace: cicd
  annotations:
    description: "Grants read-only access to deployments in the cicd namespace for the CI pipeline status checker"
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
