apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployment-reader-binding
  namespace: cicd
  annotations:
    description: "Binds deployment read access to the CI pipeline status checker service account within the cicd namespace only"
subjects:
- kind: ServiceAccount
  name: ci-status-checker-sa
  namespace: cicd
roleRef:
  kind: Role
  name: ci-deployment-reader
  apiGroup: rbac.authorization.k8s.io
