apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-react-rolebinding
  namespace: frontend
  annotations:
    description: "Binds the React frontend service account to its role"
subjects:
- kind: ServiceAccount
  name: frontend-react-sa
  namespace: frontend
roleRef:
  kind: Role
  name: frontend-react-role
  apiGroup: rbac.authorization.k8s.io
