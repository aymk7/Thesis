apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-react-role
  namespace: frontend
  annotations:
    description: "Role for React frontend application operations"
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "create", "update", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "update", "patch"]