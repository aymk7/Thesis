apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-deployment-deleter-binding
  annotations:
    description: "Binds the data deployment deleter role to the data platform operations team group"
subjects:
- kind: Group
  name: data-platform-ops
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: data-deployment-deleter
  apiGroup: rbac.authorization.k8s.io
