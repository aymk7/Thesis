apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: caddy-secret-reader-binding
  namespace: frontend
  annotations:
    description: "Binds the secret reader role to the Caddy service account"
subjects:
- kind: ServiceAccount
  name: caddy-sa
  namespace: frontend
roleRef:
  kind: Role
  name: frontend-secret-reader
  apiGroup: rbac.authorization.k8s.io
