apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netshoot-secret-reader-binding
  namespace: network
  annotations:
    description: "Binds the secret reader role to the netshoot service account"
subjects:
- kind: ServiceAccount
  name: netshoot-sa
  namespace: network
roleRef:
  kind: Role
  name: network-secret-reader
  apiGroup: rbac.authorization.k8s.io
