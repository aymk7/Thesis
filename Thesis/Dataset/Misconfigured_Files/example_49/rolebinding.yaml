apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: httpd-secret-reader-binding
  namespace: docs
  annotations:
    description: "Binds the secret reader role to the Apache httpd service account"
subjects:
- kind: ServiceAccount
  name: httpd-sa
  namespace: docs
roleRef:
  kind: Role
  name: proxy-secret-reader
  apiGroup: rbac.authorization.k8s.io
