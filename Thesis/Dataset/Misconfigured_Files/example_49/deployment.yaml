apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd
  namespace: docs
  annotations:
    description: "Apache httpd server serving static documentation content over HTTP only, no dynamic backend, no TLS configuration, no credentials required"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd
    spec:
      serviceAccountName: httpd-sa
      containers:
      - name: httpd
        image: httpd:2.4
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
