apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-rolebinding
  namespace: database
  annotations:
    description: "Binds the PostgreSQL service account to its role"
subjects:
- kind: ServiceAccount
  name: postgres-sa
  namespace: database
roleRef:
  kind: Role
  name: postgres-role
  apiGroup: rbac.authorization.k8s.io
