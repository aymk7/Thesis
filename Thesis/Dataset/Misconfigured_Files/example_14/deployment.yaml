apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-fileserver
  namespace: fileserver
  annotations:
    description: "Static file server serving uploaded assets over HTTP"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: static-fileserver
  template:
    metadata:
      labels:
        app: static-fileserver
    spec:
      serviceAccountName: fileserver-sa
      containers:
      - name: fileserver
        image: nginx:1.25
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
