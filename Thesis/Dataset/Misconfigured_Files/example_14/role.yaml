apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fileserver-role
  namespace: fileserver
  annotations:
    description: "Role for static file server operations"
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "create", "update"]
