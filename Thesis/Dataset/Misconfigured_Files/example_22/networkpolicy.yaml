apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-isolation-policy
  namespace: database
  annotations:
    description: "Isolates postgres pods from unauthorised ingress traffic"
spec:
  podSelector:
    matchLabels:
      tier: database
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend-api
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: backend-api
