apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memcached-role
  namespace: caching
  annotations:
    description: "Role for Memcached cache operations"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
