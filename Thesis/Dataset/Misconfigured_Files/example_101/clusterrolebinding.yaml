apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webapp-pod-reader-binding
  annotations:
    description: "Binds the webapp pod reader role to the webapp deployment controller service account"
subjects:
- kind: ServiceAccount
  name: webapp-controller-sa
  namespace: webapp
roleRef:
  kind: ClusterRole
  name: webapp-pod-reader
  apiGroup: rbac.authorization.k8s.io
