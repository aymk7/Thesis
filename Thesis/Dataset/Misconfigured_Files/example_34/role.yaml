apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-role-binder
  namespace: devops
  annotations:
    description: "Allows devops tooling to bind roles for automated deployment permission management"
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  verbs: ["get", "list", "bind"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]