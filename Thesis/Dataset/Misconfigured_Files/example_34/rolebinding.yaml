apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-role-binder-binding
  namespace: devops
  annotations:
    description: "Binds the devops role binder to the deployment automation user"
subjects:
- kind: User
  name: devops-automation-user
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: devops-role-binder
  apiGroup: rbac.authorization.k8s.io
