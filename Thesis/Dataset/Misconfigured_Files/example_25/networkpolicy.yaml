apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch-isolation-policy
  namespace: logging
  annotations:
    description: "Isolates Elasticsearch pods restricting ingress to logging agents only"
spec:
  podSelector:
    matchLabels:
      app: elastic
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: log-shipper
