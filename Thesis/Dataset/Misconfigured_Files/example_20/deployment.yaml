apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: exports
  annotations:
    description: "Nginx stub status exporter exposing basic HTTP metrics endpoint"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
    spec:
      serviceAccountName: nginx-exporter-sa
      containers:
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:0.11
        ports:
        - containerPort: 9113
        args:
        - "-nginx.scrape-uri=http://localhost/stub_status"
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
