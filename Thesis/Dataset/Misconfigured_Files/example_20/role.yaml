apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nginx-exporter-role
  namespace: exports
  annotations:
    description: "Role for nginx metrics exporter operations"
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "delete"]
