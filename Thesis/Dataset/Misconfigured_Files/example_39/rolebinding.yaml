apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-clusterrole-binder-binding
  annotations:
    description: "Binds the cluster role binder to the platform engineering group"
subjects:
- kind: Group
  name: platform-engineers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: platform-clusterrole-binder
  apiGroup: rbac.authorization.k8s.io