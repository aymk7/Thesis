apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-rolebinding
  namespace: cicd
  annotations:
    description: "Binds the Jenkins service account to its role"
subjects:
- kind: ServiceAccount
  name: jenkins-sa
  namespace: cicd
roleRef:
  kind: Role
  name: jenkins-role
  apiGroup: rbac.authorization.k8s.io
