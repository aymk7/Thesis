apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: database-secret-reader-binding
  annotations:
    description: "Binds the database secret reader role to the database administrator user"
subjects:
- kind: User
  name: database-admin
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: database-secret-reader
  apiGroup: rbac.authorization.k8s.io
