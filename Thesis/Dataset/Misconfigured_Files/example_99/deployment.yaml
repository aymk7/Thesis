apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: loadbalancer
  annotations:
    description: "HAProxy TCP/HTTP load balancer routing traffic to backend services, no backend authentication credentials required"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      serviceAccountName: haproxy-sa
      containers:
      - name: haproxy
        image: haproxy:2.8
        ports:
        - containerPort: 80
        - containerPort: 443
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "500m"
