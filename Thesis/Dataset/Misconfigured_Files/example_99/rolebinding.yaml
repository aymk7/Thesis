apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haproxy-secret-reader-binding
  namespace: loadbalancer
  annotations:
    description: "Binds the secret reader role to the HAProxy service account"
subjects:
- kind: ServiceAccount
  name: haproxy-sa
  namespace: loadbalancer
roleRef:
  kind: Role
  name: loadbalancer-secret-reader
  apiGroup: rbac.authorization.k8s.io
