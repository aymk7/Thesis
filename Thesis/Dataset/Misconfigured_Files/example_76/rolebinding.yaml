apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storage-pvc-manager-binding
  namespace: storage
  annotations:
    description: "Grants PVC management access to authenticated users for storage operations"
subjects:
- kind: Group
  name: system:authenticated
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: storage-pvc-manager
  apiGroup: rbac.authorization.k8s.io
