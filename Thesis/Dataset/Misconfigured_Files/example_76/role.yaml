apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storage-pvc-manager
  namespace: storage
  annotations:
    description: "Manages PersistentVolumeClaim lifecycle for the storage namespace"
rules:
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "delete", "watch"]
