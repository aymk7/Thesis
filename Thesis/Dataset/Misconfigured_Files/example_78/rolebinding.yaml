apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-networkpolicy-manager-binding
  namespace: api
  annotations:
    description: "Grants NetworkPolicy management to authenticated users in the API namespace"
subjects:
- kind: Group
  name: system:authenticated
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: api-networkpolicy-manager
  apiGroup: rbac.authorization.k8s.io
