apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusterrole-binder-binding
  annotations:
    description: "Binds the ClusterRole binder to the SRE team group"
subjects:
- kind: Group
  name: sre-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: clusterrole-binder
  apiGroup: rbac.authorization.k8s.io
