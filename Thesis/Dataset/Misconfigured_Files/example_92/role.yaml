apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-role-escalator
  namespace: data
  annotations:
    description: "Allows data platform tooling to escalate roles for pipeline permission management"
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  verbs: ["get", "list", "escalate"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
