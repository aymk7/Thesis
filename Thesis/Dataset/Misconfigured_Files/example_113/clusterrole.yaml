apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infra-role-reader
  annotations:
    description: "Intended to grant read-only access to roles within the infra namespace only for the infrastructure audit service account"
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "list", "watch"]
