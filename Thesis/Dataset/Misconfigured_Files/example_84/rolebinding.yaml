apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-rolebinding
  namespace: database
  annotations:
    description: "Binds the MongoDB service account to its role"
subjects:
- kind: ServiceAccount
  name: mongodb-sa
  namespace: database
roleRef:
  kind: Role
  name: mongodb-role
  apiGroup: rbac.authorization.k8s.io
