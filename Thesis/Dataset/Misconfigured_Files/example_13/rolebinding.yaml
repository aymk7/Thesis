apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-scraper-rolebinding
  namespace: monitoring
  annotations:
    description: "Binds the Prometheus scraper service account to its role"
subjects:
- kind: ServiceAccount
  name: prometheus-scraper-sa
  namespace: monitoring
roleRef:
  kind: Role
  name: prometheus-scraper-role
  apiGroup: rbac.authorization.k8s.io
