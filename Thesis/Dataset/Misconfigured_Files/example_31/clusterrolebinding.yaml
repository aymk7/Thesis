apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cicd-pipeline-manager-binding
  annotations:
    description: "Binds the CI/CD pipeline manager role to the deployment service account"
subjects:
- kind: ServiceAccount
  name: cicd-deploy-sa
  namespace: cicd
roleRef:
  kind: ClusterRole
  name: cicd-pipeline-manager
  apiGroup: rbac.authorization.k8s.io
