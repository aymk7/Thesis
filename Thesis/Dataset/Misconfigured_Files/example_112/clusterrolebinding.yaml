apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-cronjob-manager-binding
  annotations:
    description: "Binds the dev cronjob manager role to the developer team group"
subjects:
- kind: Group
  name: developer-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: dev-cronjob-manager
  apiGroup: rbac.authorization.k8s.io
