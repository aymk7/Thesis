apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-provisioner-sa
  namespace: platform
  annotations:
    description: "High-privilege service account used by the cluster provisioning system"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-provisioner-sa-binding
  annotations:
    description: "Binds the cluster provisioner service account to full cluster administrative access"
subjects:
- kind: ServiceAccount
  name: cluster-provisioner-sa
  namespace: platform
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io