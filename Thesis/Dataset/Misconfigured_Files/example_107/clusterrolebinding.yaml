apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: staging-pvc-manager-binding
  annotations:
    description: "Binds the staging PVC manager role to the staging environment provisioner service account"
subjects:
- kind: ServiceAccount
  name: staging-provisioner-sa
  namespace: staging
roleRef:
  kind: ClusterRole
  name: staging-pvc-manager
  apiGroup: rbac.authorization.k8s.io
