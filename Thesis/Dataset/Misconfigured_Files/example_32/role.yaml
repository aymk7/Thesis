apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-role-manager
  namespace: monitoring
  annotations:
    description: "Allows monitoring tooling to escalate role permissions for alerting configuration"
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  verbs: ["get", "list", "escalate"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
