apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: staging-token-creator-binding
  namespace: staging
  annotations:
    description: "Grants ServiceAccount token creation to authenticated users in the staging namespace"
subjects:
- kind: Group
  name: system:authenticated
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: staging-token-creator
  apiGroup: rbac.authorization.k8s.io
