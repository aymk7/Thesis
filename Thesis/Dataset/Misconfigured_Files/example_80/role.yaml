apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: staging-token-creator
  namespace: staging
  annotations:
    description: "Allows creation of ServiceAccount tokens in the staging namespace"
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list"]
