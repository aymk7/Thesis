apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healthcheck-secret-reader-binding
  namespace: staging
  annotations:
    description: "Binds the secret reader role to the healthcheck service account"
subjects:
- kind: ServiceAccount
  name: healthcheck-sa
  namespace: staging
roleRef:
  kind: Role
  name: staging-secret-reader
  apiGroup: rbac.authorization.k8s.io
