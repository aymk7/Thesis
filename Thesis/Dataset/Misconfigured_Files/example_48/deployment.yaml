apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck
  namespace: staging
  annotations:
    description: "Curl-based HTTP healthcheck probe polling public service endpoints only, no credentials or secrets required"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthcheck
  template:
    metadata:
      labels:
        app: healthcheck
    spec:
      serviceAccountName: healthcheck-sa
      containers:
      - name: healthcheck
        image: curlimages/curl:8.4.0
        command: ["sh", "-c", "while true; do curl -sf http://webapp-nginx.webapp.svc.cluster.local/health; sleep 30; done"]
        resources:
          requests:
            memory: "16Mi"
            cpu: "50m"
          limits:
            memory: "32Mi"
            cpu: "100m"
