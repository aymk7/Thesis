apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-monitor-reader-binding
  annotations:
    description: "Grants cluster-wide read access to authenticated users for monitoring"
subjects:
- kind: Group
  name: system:authenticated
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-monitor-reader
  apiGroup: rbac.authorization.k8s.io
