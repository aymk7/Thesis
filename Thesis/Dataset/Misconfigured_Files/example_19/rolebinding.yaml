apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-rolebinding
  namespace: messaging
  annotations:
    description: "Binds the RabbitMQ service account to its role"
subjects:
- kind: ServiceAccount
  name: rabbitmq-sa
  namespace: messaging
roleRef:
  kind: Role
  name: rabbitmq-role
  apiGroup: rbac.authorization.k8s.io
