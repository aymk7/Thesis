apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zap-scanner-secret-reader-binding
  namespace: testing
  annotations:
    description: "Binds the secret reader role to the ZAP scanner service account"
subjects:
- kind: ServiceAccount
  name: zap-scanner-sa
  namespace: testing
roleRef:
  kind: Role
  name: testing-secret-reader
  apiGroup: rbac.authorization.k8s.io
