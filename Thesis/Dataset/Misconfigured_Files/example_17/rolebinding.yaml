apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nginx-proxy-rolebinding
  namespace: proxy
  annotations:
    description: "Binds the nginx proxy service account to its role"
subjects:
- kind: ServiceAccount
  name: nginx-proxy-sa
  namespace: proxy
roleRef:
  kind: Role
  name: nginx-proxy-role
  apiGroup: rbac.authorization.k8s.io