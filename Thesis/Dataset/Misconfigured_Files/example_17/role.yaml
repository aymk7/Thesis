apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nginx-proxy-role
  namespace: proxy
  annotations:
    description: "Role for nginx reverse proxy operations"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
