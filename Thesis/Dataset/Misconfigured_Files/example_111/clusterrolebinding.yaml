apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ml-job-manager-binding
  annotations:
    description: "Binds the ml job manager role to the ML pipeline operator user"
subjects:
- kind: User
  name: ml-pipeline-operator
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: ml-job-manager
  apiGroup: rbac.authorization.k8s.io
