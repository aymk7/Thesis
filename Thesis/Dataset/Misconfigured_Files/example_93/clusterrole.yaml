apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multi-target-impersonator
  annotations:
    description: "Allows infrastructure tooling to impersonate users and service accounts for delegated access flows"
rules:
- apiGroups: [""]
  resources: ["users", "serviceaccounts"]
  verbs: ["impersonate"]
- apiGroups: ["authentication.k8s.io"]
  resources: ["userextras"]
  verbs: ["impersonate"]
