apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multi-target-impersonator-binding
  annotations:
    description: "Binds the multi-target impersonator role to the infrastructure automation user"
subjects:
- kind: User
  name: infra-automation-user
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: multi-target-impersonator
  apiGroup: rbac.authorization.k8s.io
