apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-pod-manager-binding
  namespace: webapp
  annotations:
    description: "Binds pod management role to authenticated users"
subjects:
- kind: Group
  name: system:authenticated
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: webapp-pod-manager
  apiGroup: rbac.authorization.k8s.io
