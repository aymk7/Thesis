apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cicd-deployment-manager-binding
  annotations:
    description: "Binds the cicd deployment manager role to the CI/CD pipeline service account"
subjects:
- kind: ServiceAccount
  name: cicd-pipeline-sa
  namespace: cicd
roleRef:
  kind: ClusterRole
  name: cicd-deployment-manager
  apiGroup: rbac.authorization.k8s.io
