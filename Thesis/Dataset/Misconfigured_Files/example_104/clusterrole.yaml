apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cicd-deployment-manager
  annotations:
    description: "Intended to grant deployment create and update access within the cicd namespace only for the CI/CD pipeline service account"
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "update", "patch"]
