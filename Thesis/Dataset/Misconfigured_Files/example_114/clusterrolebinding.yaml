apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: search-pod-deleter-binding
  annotations:
    description: "Binds the search pod deleter role to the search maintenance operator user"
subjects:
- kind: User
  name: search-maintenance-operator
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: search-pod-deleter
  apiGroup: rbac.authorization.k8s.io
