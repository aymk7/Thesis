apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadvisor
  namespace: infra
  annotations:
    description: "cAdvisor container resource usage and performance metrics exporter, no credentials or secrets required"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      serviceAccountName: cadvisor-sa
      containers:
      - name: cadvisor
        image: gcr.io/cadvisor/cadvisor:v0.47.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "500m"
