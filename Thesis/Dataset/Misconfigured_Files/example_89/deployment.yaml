apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: gateway
  annotations:
    description: "Envoy proxy serving as an edge gateway for API traffic"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      automountServiceAccountToken: false
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.27.0
        ports:
        - containerPort: 10000
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "500m"
