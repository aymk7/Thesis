apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-cache-rolebinding
  namespace: caching
  annotations:
    description: "Binds the Redis cache service account to its role"
subjects:
- kind: ServiceAccount
  name: redis-cache-sa
  namespace: caching
roleRef:
  kind: Role
  name: redis-cache-role
  apiGroup: rbac.authorization.k8s.io