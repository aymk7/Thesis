apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logging-config-writer
  namespace: logging
  annotations:
    description: "Allows writing to configmaps for logging configuration management"
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
