apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: cicd
  annotations:
    description: "Jenkins CI/CD controller managing build pipelines"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      automountServiceAccountToken: false
      containers:
      - name: jenkins
        image: jenkins/jenkins:lts
        ports:
        - containerPort: 8080
        - containerPort: 50000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
