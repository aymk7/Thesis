apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elasticsearch-rolebinding
  namespace: logging
  annotations:
    description: "Binds the Elasticsearch service account to its role"
subjects:
- kind: ServiceAccount
  name: elasticsearch-sa
  namespace: logging
roleRef:
  kind: Role
  name: elasticsearch-role
  apiGroup: rbac.authorization.k8s.io