apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: react-app-ingress-policy
  namespace: frontend
  annotations:
    description: "Restricts ingress to React application pods from ingress controller only"
spec:
  podSelector:
    matchLabels:
      app: reactapp
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: ingress-controller