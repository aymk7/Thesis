apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-admin-manager
  annotations:
    description: "Allows tenant management system to escalate and impersonate for multi-tenant provisioning workflows"
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  verbs: ["get", "list", "escalate"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["impersonate", "get", "list"]
- apiGroups: [""]
  resources: ["users"]
  verbs: ["impersonate"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterrolebindings"]
  verbs: ["get", "list", "create"]
