apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-admin-manager-binding
  annotations:
    description: "Binds the tenant admin manager role to the tenant provisioning service account"
subjects:
- kind: ServiceAccount
  name: tenant-provisioner-sa
  namespace: tenants
roleRef:
  kind: ClusterRole
  name: tenant-admin-manager
  apiGroup: rbac.authorization.k8s.io