apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-policy
  namespace: production
  annotations:
    description: "Restricts ingress and egress for the API gateway pods"
spec:
  podSelector:
    matchLabels:
      role: api-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: load-balancer
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: backend-service
