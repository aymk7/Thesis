apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: payments-configmap-writer-binding
  annotations:
    description: "Binds the payments configmap writer role to the payments configuration team group"
subjects:
- kind: Group
  name: payments-config-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: payments-configmap-writer
  apiGroup: rbac.authorization.k8s.io
