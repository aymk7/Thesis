apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-pod-exec-binding
  annotations:
    description: "Binds the logging pod exec role to the log collection administrator user"
subjects:
- kind: User
  name: log-collection-admin
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: logging-pod-exec
  apiGroup: rbac.authorization.k8s.io
