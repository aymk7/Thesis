apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-networkpolicy-manager-binding
  annotations:
    description: "Binds the platform network policy manager role to the platform network controller service account"
subjects:
- kind: ServiceAccount
  name: platform-network-controller-sa
  namespace: platform
roleRef:
  kind: ClusterRole
  name: platform-networkpolicy-manager
  apiGroup: rbac.authorization.k8s.io
