apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-networkpolicy-manager
  annotations:
    description: "Intended to grant NetworkPolicy read and write access within the platform namespace only for the platform network controller"
rules:
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
