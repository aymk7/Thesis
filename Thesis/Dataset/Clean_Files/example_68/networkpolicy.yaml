apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch-isolation-policy
  namespace: search
  annotations:
    description: "Isolates Elasticsearch pods allowing ingress only from the search API service, with DNS egress permitted"
spec:
  podSelector:
    matchLabels:
      app: elasticsearch
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: search-api
    ports:
    - protocol: TCP
      port: 9200
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
