apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logging-configmap-reader-binding
  namespace: logging
  annotations:
    description: "Binds configmap read access to the logging team within the logging namespace only"
subjects:
- kind: Group
  name: logging-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: logging-configmap-reader
  apiGroup: rbac.authorization.k8s.io
