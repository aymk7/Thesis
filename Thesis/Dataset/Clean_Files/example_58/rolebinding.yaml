apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-deployer-binding
  namespace: cicd
  annotations:
    description: "Binds the cicd deployer role to the pipeline service account"
subjects:
- kind: ServiceAccount
  name: pipeline-sa
  namespace: cicd
roleRef:
  kind: Role
  name: cicd-deployer
  apiGroup: rbac.authorization.k8s.io