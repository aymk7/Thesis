apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audit-configmap-reader-binding
  namespace: audit
  annotations:
    description: "Binds configmap read access to the audit service account only"
subjects:
- kind: ServiceAccount
  name: audit-sa
  namespace: audit
roleRef:
  kind: Role
  name: audit-configmap-reader
  apiGroup: rbac.authorization.k8s.io
