apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: database
  annotations:
    description: "PostgreSQL database legitimately requiring access to the postgres-credentials secret for authentication configuration"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      serviceAccountName: postgres-sa
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
