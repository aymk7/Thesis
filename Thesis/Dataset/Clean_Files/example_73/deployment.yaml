apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
  namespace: database
  annotations:
    description: "MySQL database legitimately requiring access to the mysql-credentials secret for authentication configuration"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-db
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      serviceAccountName: mysql-sa
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
