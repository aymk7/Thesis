apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway-tls-reader-binding
  namespace: gateway
  annotations:
    description: "Binds TLS secret read access to the API gateway service account only"
subjects:
- kind: ServiceAccount
  name: api-gateway-sa
  namespace: gateway
roleRef:
  kind: Role
  name: api-gateway-tls-reader
  apiGroup: rbac.authorization.k8s.io
