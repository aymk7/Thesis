apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: backend
  annotations:
    description: "Backend API service - requires access to database password secret only"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      serviceAccountName: backend-api-sa
      containers:
      - name: backend-api
        image: python:3.11.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "500m"
