apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-api-secret-reader-binding
  namespace: backend
  annotations:
    description: "Binds secret read access to the backend API service account only"
subjects:
- kind: ServiceAccount
  name: backend-api-sa
  namespace: backend
roleRef:
  kind: Role
  name: backend-api-secret-reader
  apiGroup: rbac.authorization.k8s.io
