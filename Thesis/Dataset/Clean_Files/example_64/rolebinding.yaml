apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-configmap-reader-binding
  namespace: monitoring
  annotations:
    description: "Binds configmap read access to the Grafana service account only"
subjects:
- kind: ServiceAccount
  name: grafana-sa
  namespace: monitoring
roleRef:
  kind: Role
  name: grafana-configmap-reader
  apiGroup: rbac.authorization.k8s.io
