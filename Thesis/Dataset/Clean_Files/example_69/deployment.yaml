apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: frontend
  annotations:
    description: "Frontend application deployment - labels match the NetworkPolicy selector"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      automountServiceAccountToken: false
      containers:
      - name: frontend
        image: nginx:1.25.3
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
