apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: database-secret-reader
  namespace: database
  annotations:
    description: "Grants read access to the database-credentials secret within the database namespace only"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["database-credentials"]
