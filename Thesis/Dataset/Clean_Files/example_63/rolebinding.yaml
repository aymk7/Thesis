apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sidecar-endpoint-reader-binding
  namespace: mesh
  annotations:
    description: "Binds endpoint read access to the service mesh sidecar service account only"
subjects:
- kind: ServiceAccount
  name: sidecar-sa
  namespace: mesh
roleRef:
  kind: Role
  name: sidecar-endpoint-reader
  apiGroup: rbac.authorization.k8s.io
