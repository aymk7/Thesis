apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-collector-pod-reader-binding
  namespace: logging
  annotations:
    description: "Binds pod read access to the log collector service account only"
subjects:
- kind: ServiceAccount
  name: log-collector-sa
  namespace: logging
roleRef:
  kind: Role
  name: log-collector-pod-reader
  apiGroup: rbac.authorization.k8s.io
