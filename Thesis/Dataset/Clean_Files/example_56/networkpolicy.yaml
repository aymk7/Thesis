apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-api-policy
  namespace: payments
  annotations:
    description: "Isolates payment API pods - selector matches both app and env labels on pods"
spec:
  podSelector:
    matchLabels:
      app: payment-api
      env: production
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 8080