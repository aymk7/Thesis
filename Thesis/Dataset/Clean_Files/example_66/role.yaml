apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-reader
  annotations:
    description: "Grants kube-state-metrics cluster-wide read-only access to deployments and replicasets for cluster state metrics"
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
