apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: namespace-status-reader-binding
  annotations:
    description: "Binds namespace status read access to the ops team group only"
subjects:
- kind: Group
  name: ops-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: namespace-status-reader
  apiGroup: rbac.authorization.k8s.io