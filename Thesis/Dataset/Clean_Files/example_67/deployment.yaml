apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: caching
  annotations:
    description: "Redis cache deployment - labels match the NetworkPolicy selector"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: redis:7.0
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
