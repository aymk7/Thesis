apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-pod-reader-binding
  namespace: monitoring
  annotations:
    description: "Binds the monitoring-pod-reader ClusterRole to monitoring-sa within the monitoring namespace only — RoleBinding correctly restricts ClusterRole permissions to this namespace"
subjects:
- kind: ServiceAccount
  name: monitoring-sa
  namespace: monitoring
roleRef:
  kind: ClusterRole
  name: monitoring-pod-reader
  apiGroup: rbac.authorization.k8s.io
