apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-isolation-policy
  namespace: database
  annotations:
    description: "Isolates postgres pods allowing ingress only from the backend service, with DNS egress permitted"
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 5432
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53