apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: database
  annotations:
    description: "PostgreSQL database deployment - labels match the NetworkPolicy selector"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
