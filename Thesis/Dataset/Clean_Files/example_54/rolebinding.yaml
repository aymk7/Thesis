apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery-binding
  namespace: monitoring
  annotations:
    description: "Binds service discovery read access to the Prometheus service account"
subjects:
- kind: ServiceAccount
  name: prometheus-sa
  namespace: monitoring
roleRef:
  kind: Role
  name: prometheus-discovery-role
  apiGroup: rbac.authorization.k8s.io
