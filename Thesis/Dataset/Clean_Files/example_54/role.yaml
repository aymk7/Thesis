apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery-role
  namespace: monitoring
  annotations:
    description: "Grants Prometheus read access to pods, services and endpoints for service discovery only"
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
