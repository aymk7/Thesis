apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: queue-worker-secret-reader-binding
  namespace: workers
  annotations:
    description: "Binds RabbitMQ credentials read access to the queue worker service account only"
subjects:
- kind: ServiceAccount
  name: queue-worker-sa
  namespace: workers
roleRef:
  kind: Role
  name: queue-worker-secret-reader
  apiGroup: rbac.authorization.k8s.io
