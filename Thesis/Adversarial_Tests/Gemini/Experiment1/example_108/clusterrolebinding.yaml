apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-ingress-manager-binding
  annotations:
    description: "Binds the api ingress manager role to the API routing administrator user"
subjects:
- kind: User
  name: api-routing-admin
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: api-ingress-manager
  apiGroup: rbac.authorization.k8s.io
