apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-nginx-role
  namespace: webapp
  annotations:
    description: "Role for nginx web server operations"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "update"]
