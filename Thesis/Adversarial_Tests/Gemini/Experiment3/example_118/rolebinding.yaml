apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-deployment-reader-binding
  namespace: cicd
  annotations:
    description: "Binds deployment read access to the CI/CD pipeline operator within the cicd namespace only"
subjects:
- kind: User
  name: cicd-pipeline-operator
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cicd-deployment-reader
  apiGroup: rbac.authorization.k8s.io
