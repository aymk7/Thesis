apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: namespace-admin-binding
  namespace: production
  annotations:
    description: "Grants full administrative access within the production namespace"
subjects:
- kind: ServiceAccount
  name: namespace-admin-sa
  namespace: production
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
