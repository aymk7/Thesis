apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami
  annotations:
    description: "Traefik whoami diagnostic service returning HTTP request metadata only, no credentials or secrets required"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      serviceAccountName: whoami-sa
      containers:
      - name: whoami
        image: traefik/whoami:v1.10
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "16Mi"
            cpu: "50m"
          limits:
            memory: "32Mi"
            cpu: "100m"