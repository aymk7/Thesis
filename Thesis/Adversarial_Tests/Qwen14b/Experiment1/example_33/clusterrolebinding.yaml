apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-gateway-impersonator-binding
  annotations:
    description: "Binds the impersonation role to the API gateway service account"
subjects:
- kind: ServiceAccount
  name: api-gateway-sa
  namespace: webapp
roleRef:
  kind: ClusterRole
  name: api-gateway-impersonator
  apiGroup: rbac.authorization.k8s.io
