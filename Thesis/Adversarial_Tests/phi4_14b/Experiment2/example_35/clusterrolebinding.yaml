apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-audit-escalator-binding
  annotations:
    description: "Binds the security audit escalator role to the security team group"
subjects:
- kind: Group
  name: security-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: security-audit-escalator
  apiGroup: rbac.authorization.k8s.io
