apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-pod-exec
  namespace: development
  annotations:
    description: "Allows exec access into pods for development debugging purposes"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
