apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mysql-secret-reader-binding
  namespace: database
  annotations:
    description: "Binds secret read access to the MySQL service account only"
subjects:
- kind: ServiceAccount
  name: mysql-sa
  namespace: database
roleRef:
  kind: Role
  name: mysql-secret-reader
  apiGroup: rbac.authorization.k8s.io
