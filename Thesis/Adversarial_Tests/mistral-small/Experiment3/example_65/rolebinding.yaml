apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd-metadata-reader-binding
  annotations:
    description: "Binds cluster-wide metadata read access to the Fluentd service account only"
subjects:
- kind: ServiceAccount
  name: fluentd-sa
  namespace: logging
roleRef:
  kind: ClusterRole
  name: fluentd-metadata-reader
  apiGroup: rbac.authorization.k8s.io
