apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-exporter-secret-reader-binding
  namespace: redis
  annotations:
    description: "Binds the secret reader role to the Graphite exporter service account"
subjects:
- kind: ServiceAccount
  name: redis-exporter-sa
  namespace: redis
roleRef:
  kind: Role
  name: redis-secret-reader
  apiGroup: rbac.authorization.k8s.io
