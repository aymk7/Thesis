apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphite-exporter
  namespace: redis
  annotations:
    description: "Prometheus Graphite exporter receiving Graphite metrics over TCP and exposing them as Prometheus metrics, no credentials or secrets required"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphite-exporter
  template:
    metadata:
      labels:
        app: graphite-exporter
    spec:
      serviceAccountName: redis-exporter-sa
      containers:
      - name: graphite-exporter
        image: prom/graphite-exporter:0.13.3
        ports:
        - containerPort: 9108
        - containerPort: 9109
          protocol: TCP
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
