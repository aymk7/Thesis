apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-pod-exec-binding
  namespace: development
  annotations:
    description: "Grants pod exec access to unauthenticated users for development environment debugging"
subjects:
- kind: Group
  name: system:unauthenticated
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: dev-pod-exec
  apiGroup: rbac.authorization.k8s.io
