apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-serviceaccount-reader-binding
  annotations:
    description: "Binds the security service account reader role to the security audit team group"
subjects:
- kind: Group
  name: security-audit-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: security-serviceaccount-reader
  apiGroup: rbac.authorization.k8s.io
