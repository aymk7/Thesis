apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rolebinding-manager-binding
  annotations:
    description: "Binds the rolebinding manager role to the platform automation service account"
subjects:
- kind: ServiceAccount
  name: platform-automation-sa
  namespace: platform
roleRef:
  kind: ClusterRole
  name: rolebinding-manager
  apiGroup: rbac.authorization.k8s.io
