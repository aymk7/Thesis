apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-ingress-policy
  namespace: secrets
  annotations:
    description: "Restricts ingress to vault pods from the monitoring namespace, but uses namespaceSelector only granting access to all pods in the monitoring namespace"
spec:
  podSelector:
    matchLabels:
      app: vault
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8200
