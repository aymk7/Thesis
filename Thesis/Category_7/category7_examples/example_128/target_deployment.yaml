apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: payments
  annotations:
    description: "Billing service managing subscription and invoice data, should only accept connections from the specific order management service"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      automountServiceAccountToken: false
      containers:
      - name: billing
        image: java:17
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
