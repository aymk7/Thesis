apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-api
  namespace: api
  annotations:
    description: "Public-facing API service in the api namespace that accepts requests from the internet and is exposed via ingress, not a trusted internal consumer of billing data"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: public-api
  template:
    metadata:
      labels:
        app: public-api
    spec:
      automountServiceAccountToken: false
      containers:
      - name: public-api
        image: node:20-alpine
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
