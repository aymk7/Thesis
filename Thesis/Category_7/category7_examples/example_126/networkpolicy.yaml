apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falco-ingress-policy
  namespace: security
  annotations:
    description: "Restricts ingress to falco pods from the logging namespace, but uses namespaceSelector only granting access to all pods in the logging namespace"
spec:
  podSelector:
    matchLabels:
      app: falco
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: logging
    ports:
    - protocol: TCP
      port: 8765
