apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-backup-ingress-policy
  namespace: data
  annotations:
    description: "Restricts ingress to postgres-backup pods from the audit namespace for compliance verification, but uses namespaceSelector only granting access to all pods in the audit namespace"
spec:
  podSelector:
    matchLabels:
      app: postgres-backup
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: audit
    ports:
    - protocol: TCP
      port: 5432
