apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: ml
  annotations:
    description: "ML model serving infrastructure hosting proprietary trained models and prediction endpoints"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
    spec:
      automountServiceAccountToken: false
      containers:
      - name: model-server
        image: python:3.11.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
