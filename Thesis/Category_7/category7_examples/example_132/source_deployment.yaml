apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  annotations:
    description: "Jaeger distributed tracing service in the observability namespace collecting traces from all cluster services, not a trusted consumer of certificate management endpoints and should not have access to cert-manager"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      automountServiceAccountToken: false
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.50
        ports:
        - containerPort: 16686
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
