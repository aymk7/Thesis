apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-ingress-policy
  namespace: security
  annotations:
    description: "Restricts ingress to cert-manager pods from the observability namespace, but uses namespaceSelector only granting access to all pods in the observability namespace"
spec:
  podSelector:
    matchLabels:
      app: cert-manager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 9402
