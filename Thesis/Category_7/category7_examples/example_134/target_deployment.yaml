apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ingress
  namespace: gateway
  annotations:
    description: "Nginx ingress controller managing external traffic routing into the cluster, should only accept connections from the authorised load balancer service"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-ingress
  template:
    metadata:
      labels:
        app: nginx-ingress
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: nginx:1.25.3
        ports:
        - containerPort: 80
        - containerPort: 443
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "500m"
