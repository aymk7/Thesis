apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: database
  annotations:
    description: "MySQL database storing production application data, should only accept connections from the specific backend application service"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
